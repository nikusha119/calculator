<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>კალკულატორი</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="topbar">
    <button class="switch" id="themeSwitch" data-on="true" aria-label="დარკ მოუდი">
      <div class="knob" id="knobIcon">🌙</div>
    </button>
  </div>

  <div class="display">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="pad" id="pad">
    <button class="key fn" data-action="clear">C</button>
    <button class="key fn" data-action="sign">+/-</button>
    <button class="key fn" data-action="percent">%</button>
    <button class="key op" data-action="op" data-op="÷">÷</button>

    <button class="key num" data-digit="7">7</button>
    <button class="key num" data-digit="8">8</button>
    <button class="key num" data-digit="9">9</button>
    <button class="key op" data-action="op" data-op="×">×</button>

    <button class="key num" data-digit="4">4</button>
    <button class="key num" data-digit="5">5</button>
    <button class="key num" data-digit="6">6</button>
    <button class="key op" data-action="op" data-op="−">−</button>

    <button class="key num" data-digit="1">1</button>
    <button class="key num" data-digit="2">2</button>
    <button class="key num" data-digit="3">3</button>
    <button class="key op" data-action="op" data-op="+">+</button>

    <button class="key num zero" data-digit=".">0&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;.</button>
    <button class="key fn" data-action="back">⌫</button>
    <button class="key op" data-action="equals">=</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
